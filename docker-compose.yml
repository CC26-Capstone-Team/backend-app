version: "3.8"

services:
  backend:
    container_name: capstone-backend
    build: .
    ports:
      - "4000:4000"
    env_file:
      - .env
    depends_on:
      - db-postgres

  db-postgres:
    image: postgres:15-alpine
    container_name: capstone-postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432" # Membuka port agar bisa dicek lewat DBeaver/pgAdmin dari host
    volumes:
      - pgdata:/var/lib/postgresql/data # Volume agar data persisten

volumes:
  pgdata:
