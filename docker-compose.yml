version: '3.8'

services:
  backend:
    container_name: capstone-backend
    build: .
    ports:
      - "4000:4000"
    volumes:
      - .:/usr/src/app
      # Anonymous volume untuk mengisolasi node_modules milik kontainer
      - /usr/src/app/node_modules
    environment:
      - NODE_ENV=development